ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /rtabmap/odom
    odom0_config: [true, true, true,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_relative: true
    odom0_differential: false

    odom1: /odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   false, false, true,
                   false, false, false]
    odom1_relative: false
    odom1_differential: false